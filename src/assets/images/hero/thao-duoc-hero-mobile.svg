<svg width="375" height="480" viewBox="0 0 375 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Minh họa lọ cao thảo dược — bản mobile</title>
<desc>Lọ thủy tinh màu hổ phách chứa cao thảo dược với con dấu tròn khắc chữ Hán, trên nền xanh tùng đậm, bố cục rút gọn cho màn hình hẹp.</desc>
<defs>
  <linearGradient id="jarGradM" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3C5C4B"/>
    <stop offset="55%" stop-color="#2C4A3B"/>
    <stop offset="100%" stop-color="#1C3128"/>
  </linearGradient>
</defs>
<style>
  .bg{ fill:#1C3128; }
  .leaf2{ fill:#33503F; }
  .branch{ fill:none; stroke:#6B8A76; stroke-width:1.2; }
  .paper{ fill:#F5F0E3; }
  .ink{ fill:#221F1A; }
  .sage{ fill:#A9B79C; }
  .zhtext{ font-family:'Noto Serif SC','Songti SC',serif; }
  .serif{ font-family:'Fraunces','Georgia',serif; }
  .sans{ font-family:'Be Vietnam Pro','Helvetica Neue',sans-serif; }
</style>

<rect class="bg" width="375" height="480"/>

<circle cx="187" cy="210" r="180" fill="#213C30" opacity="0.6"/>
<circle cx="187" cy="210" r="135" fill="#25412F" opacity="0.5"/>

<g opacity="0.5">
  <path class="branch" d="M30 60 C 65 42, 88 72, 70 108 C 58 130, 28 136, 16 112"/>
  <ellipse class="leaf2" cx="52" cy="78" rx="12" ry="5.5" transform="rotate(-30 52 78)"/>
  <ellipse class="leaf2" cx="68" cy="98" rx="11" ry="5" transform="rotate(20 68 98)"/>

  <path class="branch" d="M345 340 C 312 322, 300 356, 322 380 C 336 394, 358 386, 361 368"/>
  <ellipse class="leaf2" cx="320" cy="350" rx="11" ry="5" transform="rotate(35 320 350)"/>
</g>

<g transform="translate(122,95)">
  <path d="M0 300 L9 300 L17 78 Q18 54 42 54 L90 54 Q114 54 115 78 L123 300 L132 300 L132 312 Q132 324 120 324 L12 324 Q0 324 0 312 Z" fill="url(#jarGradM)"/>
  <path d="M17 78 Q18 54 42 54 L90 54 Q114 54 115 78 L115 105 L17 105 Z" fill="#3C5C4B" opacity="0.6"/>
  <rect x="49" y="33" width="34" height="27" rx="3" fill="#8A6A38"/>
  <rect x="53" y="21" width="26" height="17" rx="6" fill="#6B4E27"/>

  <rect x="11" y="138" width="110" height="140" rx="4" class="paper"/>
  <circle cx="66" cy="172" r="16" fill="none" stroke="#B9863F" stroke-width="1.3"/>
  <circle cx="66" cy="172" r="12" fill="none" stroke="#E7CFA0" stroke-width="0.9"/>
  <text x="66" y="178" text-anchor="middle" class="zhtext ink" font-size="13" font-weight="500">草</text>

  <text x="66" y="209" text-anchor="middle" class="serif ink" font-size="13" font-weight="500">Cao Ngũ Vị Tử</text>
  <text x="66" y="224" text-anchor="middle" class="zhtext sage" font-size="8.5">五味子膏</text>

  <line x1="27" y1="242" x2="105" y2="242" stroke="#D8CDA8" stroke-width="1"/>
  <text x="66" y="257" text-anchor="middle" class="ink sans" font-size="7" letter-spacing="1" opacity="0.6">NATURAL · NO. 05</text>
</g>

<g transform="translate(60,410)">
  <circle r="30" fill="none" stroke="#B9863F" stroke-width="1.3"/>
  <circle r="24" fill="none" stroke="#E7CFA0" stroke-width="0.9"/>
  <text y="6" text-anchor="middle" class="zhtext" font-size="17" fill="#F5F0E3" font-weight="500">信</text>
</g>
<text x="102" y="405" class="serif" font-size="12" fill="#E7CFA0" font-weight="500">147 năm</text>
<text x="102" y="420" class="sage sans" font-size="9.5" letter-spacing="0.3">gìn giữ y học cổ truyền</text>
</svg>
