<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960" role="img" aria-hidden="true">
  <!-- Neutral, brand-owned "no photo yet" placeholder for Natural Oils
       products without a real product image. Deliberately abstract line
       art (not a photo, not a real bottle, no label/text/logo) so it can
       never be mistaken for an actual product or another brand's
       packaging; see src/lib/product-image-fallback.ts for the swap
       point once real photography exists. -->
